<script>

    {id:262,title:'Onboarding: skip tour for returning users',repo:'acme/webapp',status:'Todo',meta:'Updated 1h ago',pr:'',attention:'',mine:true,labels:['ux']},
    {id:233,title:'Rate-limit the public API',repo:'acme/webapp',status:'Backlog',meta:'Updated 2h ago',pr:'',attention:'Assigned to you',mine:true,labels:['security'],priority:'High'},
    {id:215,title:'Flaky test: checkout e2e times out on CI',repo:'acme/webapp',status:'Todo',meta:'Updated 3h ago',pr:'',attention:'',mine:true,labels:['flaky','ci']},
    {id:229,title:'Ship the mobile responsive navigation',repo:'acme/webapp',status:'Done',meta:'Updated 4h ago',pr:'Merged PR #480',attention:'',mine:true,labels:['mobile']},
    {id:290,title:'Document the public API error responses',repo:'acme/webapp',status:'Backlog',meta:'Updated 5h ago',pr:'',attention:'',mine:true,labels:['docs'],priority:'Low'},
    {id:301,title:'Add a keyboard shortcut to jump to Inbox',repo:'acme/webapp',status:'Todo',meta:'Updated 6h ago',pr:'',attention:'',mine:true,labels:['keyboard','ux']},
    {id:240,title:'Migrate search to the new index cluster',repo:'acme/webapp',status:'In progress',meta:'Updated 2h ago',pr:'Merged PR #495',attention:'',mine:true,labels:['infra','tech-debt'],milestone:'v1.4'},
    {id:310,title:'Show webhook retry history to support',repo:'acme/webapp',status:'In progress',meta:'Updated 3h ago',pr:'Open PR #506',attention:'',mine:true,labels:['payments','support'],milestone:'v1.4'},
    {id:299,title:'Save filters across app restarts',repo:'acme/webapp',status:'In review',meta:'Updated 2h ago',pr:'Open PR #503',attention:'',mine:true,labels:['enhancement','filters']},
    {id:287,title:'Improve keyboard navigation in dropdowns',repo:'acme/webapp',status:'Done',meta:'Updated 5h ago',pr:'Merged PR #488',attention:'',mine:true,labels:['keyboard','accessibility']},
    {id:312,title:'Write release notes for the next milestone',repo:'acme/webapp',status:'Todo',meta:'Updated 7h ago',pr:'',attention:'',mine:false,labels:['docs'],priority:'Low'}
  ];
  const instances = [];
  for (const app of root.querySelectorAll('.gt-window')) {
    const design = app.dataset.design;
    const previous = window.openai?.widgetState?.privateContent?.[design];
    const saved = previous?.revision===3 ? previous : {};
    const s = {revision:3,screen:'list',tab:'projects',density:'default',height:'tall',theme:'system',content:'Populated',search:'',mine:true,projectSource:'All',projectPriority:'All',unreadOnly:false,read:[],closed:[],pendingClose:null,collapsedBuckets:[],cardViews:{projects:'tall',issues:'tall',inbox:'tall'},status:{},created:[],comments:{},notificationSync:false,permission:true,autostart:true,beta:false,refresh:'90 seconds',defaultRepo:'Ask each time',toast:'',sourceKind:'project',sourceName:'',sourceRepo:'Product Roadmap',sourcePreset:'My open issues',sourceQuery:'-status:Released',sourceAlerts:false,sourceColor:'#4f8cff',draftTitle:'',draftBody:'',draftProject:'No project',draftRepo:'acme/webapp',draftAssign:true,detailId:284,connections:structuredClone(initialConnections),...saved};
    s.connections = Array.isArray(s.connections) ? s.connections : structuredClone(initialConnections);
    const model = {theme:s.theme,density:s.density,content:s.content,permission:s.permission};
    instances.push({design,s,model,render});
    const uid = key => `${design}-${key}`;
    const button = (label,action,cl='',attrs='') => `<button type="button" class="cursor-interaction ${cl}" data-a="${action}" ${attrs}>${label}</button>`;
    const optionButtons = (key,values) => `<div class="gt-options" role="group" aria-label="${esc(key)}">${values.map(([value,label])=>button(esc(label),'set','',`data-key="${key}" data-value="${esc(value)}" aria-pressed="${s[key]===value}"`)).join('')}</div>`;
    const choice = (key,label,values) => `<div class="gt-field"><label id="${uid(key)}-label">${esc(label)}</label><details class="gt-choice"><summary class="cursor-interaction" aria-labelledby="${uid(key)}-label ${uid(key)}-value"><span id="${uid(key)}-value">${esc(s[key])}</span>${icon('chevron-down')}</summary><div class="gt-choice-menu">${values.map(v=>button(esc(v),'set','',`data-key="${key}" data-value="${esc(v)}"`)).join('')}</div></details></div>`;
    const toggle = (key,label,hint) => `<div class="gt-toggle"><label for="${uid(key)}">${esc(label)}<span class="gt-sub">${esc(hint)}</span></label><input id="${uid(key)}" type="checkbox" data-key="${key}" ${s[key]?'checked':''}></div>`;
    const input = (key,label,placeholder='') => `<div class="gt-field"><label for="${uid(key)}">${esc(label)}</label><input id="${uid(key)}" data-key="${key}" value="${esc(s[key])}" placeholder="${esc(placeholder)}"></div>`;
    function persist() {
      if (!window.openai?.setWidgetState) return;
      const privateContent = Object.fromEntries(instances.map(i=>{const snapshot={...i.s};delete snapshot.toast;return [i.design,snapshot];}));
      const modelContent = Object.fromEntries(instances.map(i=>[i.design,{page:i.s.screen,tab:i.s.tab,cardViews:i.s.cardViews,density:i.s.density,theme:i.s.theme,scenario:i.s.content}]));
      window.openai.setWidgetState({modelContent,privateContent}).catch(()=>{});
    }
    function header(title,sub,back='settings') {
      return `<div class="gt-header">${button(`${icon('arrow-left')} ${back==='list'?'Back to tasks':back==='connections'?'Projects & repositories':'Settings'}`,'back','gt-quiet gt-back',`data-back="${back}"`)}<h1>${esc(title)}</h1>${sub?`<p class="gt-sub">${esc(sub)}</p>`:''}</div>`;
    }
    function connectionContent() {
      const cs = s.content==='No connections'?[]:s.connections;
      return `<div class="gt-between"><h2>Your connections <span class="gt-muted">${cs.length}</span></h2>${button(`${icon('plus')} Add`,'add-source','gt-primary')}</div>
        ${!cs.length?`<div class="gt-empty">${icon('panels-top-left')}<h2>Bring your GitHub work here</h2><p>Connect a project board for Projects, or a repository for Todos.</p>${button('Connect a project','add-source','gt-primary')}</div>`:cs.map(c=>`<div class="gt-connection">${icon(c.kind==='project'?'panels-top-left':'folder-git-2')}<div class="gt-fill"><h3>${esc(c.name)}</h3><p class="gt-sub">${esc(c.repo)}</p><span class="gt-status ${c.enabled?'':'gt-paused'}">${icon(c.enabled?'circle-check':'pause')}${c.enabled?'Active':'Paused'}</span></div>${button('Manage','edit-source','',`data-id="${c.id}" aria-label="Manage ${esc(c.name)}"`)}</div>`).join('')}
        <p class="gt-sub" style="margin-top:14px">Project boards appear in Projects. Repository searches appear in Todos.</p>`;
    }
    function appearanceContent() {
      return `<div class="gt-field"><label>Window height</label>${optionButtons('height',[['tall','Full height · 760 px'],['short','Compact height · 560 px']])}<p class="gt-sub">Both options keep the same 480 px width.</p></div><div class="gt-height-preview"><div class="gt-mini-window" style="height:${s.height==='tall'?108:80}px" aria-hidden="true"><span></span><span></span><span></span><span></span></div><p class="gt-small gt-muted">${s.height==='tall'?'Full height · 480 × 760':'Compact height · 480 × 560'}<br>${s.height==='tall'?'More tasks visible at once.':'Takes up less screen space.'}</p></div>
        <div class="gt-field"><label>List density</label>${optionButtons('density',[['compact','Compact'],['default','Default'],['comfortable','Comfortable'],['spacious','Spacious']])}</div>
        <div class="gt-eyebrow">Live preview</div><div class="gt-preview"><div class="gt-between"><h3>Payments: retry failed Stripe webhooks</h3><span class="gt-chip">In progress</span></div><p class="gt-sub">acme/webapp #284 · Updated 12m ago</p><p class="gt-sub">${icon('git-pull-request')} Open PR #501 · payments</p></div>
        <p class="gt-sub" style="margin-top:12px">Your task list uses this spacing immediately.</p>`;
    }
    function notificationsContent() {
      return `<div class="gt-note ${s.permission?'gt-good':'gt-warning'}"><h3>${icon(s.permission?'circle-check':'bell-off')} ${s.permission?'Desktop notifications are allowed':'Desktop notifications are turned off'}</h3><p>${s.permission?'Review requests, mentions and replies can appear as desktop alerts.':'Allow GitHub Tasks in your system notification settings to receive alerts.'}</p>${!s.permission?button('Open notification settings','permission'):''}</div>
        <h2 class="gt-section-title">GitHub read status</h2>${toggle('notificationSync','Mark notifications read when I open an item','Opening or clearing a needs-response cue in Projects or Todos also marks its GitHub notification read.')}
        <p class="gt-sub" style="margin-top:10px">Inbox’s “Mark read” always updates GitHub, whatever this setting.</p>
        <h2 class="gt-section-title">Repository alerts</h2><p class="gt-sub">Choose alerts for new matching issues inside each repository connection.</p>${button('Manage repository alerts →','page','gt-link','data-page="connections"')}`;
    }
    function generalContent() {
      return `${choice('defaultRepo','Create new issues in',['Ask each time','acme/webapp','rileydev/notes'])}
        ${choice('refresh','Refresh automatically',['30 seconds','60 seconds','90 seconds','5 minutes','15 minutes'])}
        <p class="gt-sub" style="margin:-10px 0 12px">Refresh is also available at the bottom of your task list.</p>
        ${toggle('autostart','Open GitHub Tasks when I sign in','Keep your tasks one click away in the menu bar or system tray.')}`;
    }
    function updatesContent() {
      return `<div class="gt-between"><div><h2>GitHub Tasks</h2><p class="gt-sub">Version 0.6.2</p></div>${button('Check for updates','check-updates')}</div>
        ${toggle('beta','Receive beta updates','Try features before the stable release. Betas may be less reliable.')}
        ${s.beta?'<div class="gt-note gt-warning">Turning this off returns you to stable when a newer stable version is released.</div>':''}

        <div class="gt-note"><h3>Your account stays yours</h3><p>Your sign-in token is stored securely on this device. Your issues and projects stay on GitHub.</p></div>
        <div class="gt-row">${button('Release notes ↗','release-notes','gt-link')}${button('Report an issue ↗','report-issue','gt-link')}</div>
        <details class="gt-disclosure"><summary class="cursor-interaction">Help & diagnostics</summary><div class="gt-group-body"><p class="gt-small gt-muted">Connection problems? Check organization access and SSO authorization on GitHub, then retry.</p>${button('Copy diagnostic summary','diagnostics','gt-link')}</div></details>`;
    }
    const contents = {connections:connectionContent,appearance:appearanceContent,notifications:notificationsContent,general:generalContent,updates:updatesContent};
    function settings() {
      return `${header('Settings','Make GitHub Tasks work for you.','list')}<div class="gt-content"><div class="gt-home">${pages.map(([key,title,sub,ico])=>button(`<span class="gt-home-icon">${icon(ico)}</span><span class="gt-fill"><h2>${esc(title)}</h2><span class="gt-sub">${esc(sub)}</span></span>${icon('chevron-right')}`,'page','',`data-page="${key}"`)).join('')}</div></div>`;
    }
    function source() {
      const editing = s.connections.find(c=>c.id===s.editingId);
      return `${header(editing?'Manage connection':'Add a connection',editing?'Choose how this connection appears.':'Start with the GitHub work you want to follow.','connections')}<div class="gt-content">
        ${!editing?`<div class="gt-field"><label>What would you like to connect?</label>${optionButtons('sourceKind',[['project','Project board'],['repo','Repository']])}</div>`:''}
        ${choice('sourceRepo',s.sourceKind==='project'?'Project board':'Repository',s.sourceKind==='project'?['Product Roadmap','Engineering backlog']:['acme/webapp','rileydev/notes'])}
        ${s.sourceKind==='repo'?choice('sourcePreset','Which issues?',['My open issues','All open issues','Issues I opened','Open bugs','PRs awaiting my review']):'<div class="gt-note">Items appear in Projects with their status. Released items are hidden by default.</div>'}
        ${input('sourceName','Display name','Use the project or repository name')}
        <details class="gt-disclosure"><summary class="cursor-interaction">More options</summary><div class="gt-group-body">${input('sourceQuery',s.sourceKind==='project'?'Filter project items':'Custom GitHub search')}<p class="gt-sub">Keep the default, or use GitHub search syntax.</p><div class="gt-field" style="margin-top:14px"><label for="${uid('color')}">Connection color</label><input id="${uid('color')}" type="color" data-key="sourceColor" value="${esc(s.sourceColor)}" aria-label="Connection color"></div>${s.sourceKind==='repo'?toggle('sourceAlerts','Desktop alerts for new matching issues','Separate from review, mention and reply alerts.'):''}</div></details>
        ${editing?`${toggle('sourceEnabled','Show in my task list','Turn off to pause this connection without removing it.')}<details class="gt-disclosure"><summary class="cursor-interaction">Remove connection</summary><div class="gt-group-body"><p class="gt-small gt-muted">This removes the connection from GitHub Tasks. Your GitHub issues and project are kept.</p>${button('Remove connection','remove-source','gt-danger',`data-id="${editing.id}"`)}</div></details>`:`<p class="gt-sub" style="margin-top:14px">Can’t find your ${s.sourceKind==='project'?'project':'repository'}? Check organization access on GitHub, then try again.</p>`}

    }
    function projectCard(t) {
      const status=s.status[t.id]||t.status;
      const color=statuses.find(x=>x.name===status)?.color||'backlog';

      const status=s.status[t.id]||t.status;

      picker.dataset.placement=bounds.bottom-box.bottom<needed&&box.top-bounds.top>needed?'above':'below';
    },true);
    app.addEventListener('keydown',event=>{if(event.key!=='Escape')return;if(s.pendingClose!==null){const id=s.pendingClose;s.pendingClose=null;render();persist();app.querySelector(`[data-close-id="${id}"]`)?.focus();event.preventDefault();return;}const open=event.target.closest('details[open]:not(.gt-bucket)');if(open){open.open=false;open.querySelector('summary').focus();event.preventDefault();event.stopPropagation();return;}if(s.screen!=='list'){navigate(s.screen==='settings'?'list':s.screen==='new'||s.screen==='detail'?'list':'settings');render();persist();app.querySelector('.gt-back,.gt-tools input,.gt-home button')?.focus();}});
    render();
    if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{s.theme=model.theme;s.density=model.density;s.content=model.content;s.permission=model.permission;render();persist();}});tweak.addSelect(model,'theme',{label:'Appearance',options:['system','light','dark']});tweak.addSelect(model,'density',{label:'Row density',options:['compact','default','comfortable','spacious']});tweak.addSelect(model,'content',{label:'Content state',options:['Populated','No connections','Sync error']});tweak.addToggle(model,'permission',{label:'System allows desktop alerts'});}
  }
  window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.privateContent;if(!saved)return;for(const i of instances){if(saved[i.design]){Object.assign(i.s,saved[i.design]);Object.assign(i.model,{theme:i.s.theme,density:i.s.density,content:i.s.content,permission:i.s.permission});i.render();}}});
})();
</script>
